name: openframe-news

services:
  app:
    image: ghcr.io/keithanderson85/currentevents:latest
    build: .
    container_name: openframe-news
    ports:
      - "${HOST_PORT:-3000}:3000"   # change HOST_PORT in .env if 3000 is taken
    env_file: .env          # holds OPENROUTER_API_KEY; never committed
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data  # keeps your events, notes and chats across restarts/updates
    restart: unless-stopped

volumes:
  app-data:
    name: openframe-news-data
